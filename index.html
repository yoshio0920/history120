<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入試頻出！重要年代120問 自己テスト</title>
<style>
  :root{
    --ink:#16213a; --muted:#6b7a92; --line:#dbe3ee; --bg:#f4f7fb; --card:#fff;
    --accent:#1f3864; --accent2:#2e74b5; --ok:#1a7f5a; --okbg:#e6f6ef;
    --ng:#b3261e; --ngbg:#fdecea; --warn:#a86b00;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%;}
  header{background:linear-gradient(135deg,#1f3864,#2e74b5);color:#fff;padding:18px 16px 16px;}
  header h1{margin:0;font-size:19px;letter-spacing:.02em}
  header p{margin:6px 0 0;font-size:12.5px;opacity:.88}
  .wrap{max-width:860px;margin:0 auto;padding:14px 14px 60px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(20,40,80,.05)}
  .panel h2{margin:0 0 10px;font-size:13px;color:var(--muted);letter-spacing:.08em;font-weight:700}
  .row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
  .row:last-child{margin-bottom:0}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:8px 13px;font-size:13.5px;transition:.12s}
  button:hover{border-color:var(--accent2)}
  button.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;padding:11px 22px;font-size:15px}
  button.primary:hover{background:#2a4a80}
  button.ghost{background:#eef3fa}
  .stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
  .bar{height:7px;background:#e6ecf5;border-radius:99px;overflow:hidden;margin:10px 0 0}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2e74b5,#1f3864);width:0;transition:.3s}
  /* quiz */
  #quiz{display:none}
  .qmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .qbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:center;
    box-shadow:0 2px 8px rgba(20,40,80,.06)}
  .qlabel{font-size:11.5px;color:var(--muted);letter-spacing:.14em;margin-bottom:10px}
  .qtext{font-size:26px;font-weight:800;line-height:1.4;margin:0 0 4px;word-break:keep-all}
  .qera{font-size:12px;color:var(--muted);margin-top:8px}
  .ansarea{margin-top:18px}
  input[type=text]{font:inherit;font-size:24px;text-align:center;width:170px;padding:9px 8px;border:2px solid var(--line);
    border-radius:9px;letter-spacing:.08em}
  input[type=text]:focus{outline:none;border-color:var(--accent2)}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
  @media(max-width:520px){.choices{grid-template-columns:1fr}.qtext{font-size:21px}}
  .choices button{padding:13px 10px;font-size:14.5px;text-align:left;line-height:1.35}
  .choices button.pickok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
  .choices button.pickng{background:var(--ngbg);border-color:var(--ng);color:var(--ng);font-weight:700}
  .choices button.picked{background:#e9eff8;border-color:var(--accent2);color:var(--accent);font-weight:700}
  .choices button[disabled]{opacity:1}
  .feed{margin-top:16px;border-radius:11px;padding:14px;text-align:left;display:none}
  .feed.ok{background:var(--okbg);border:1px solid #b8e3d0}
  .feed.ng{background:var(--ngbg);border:1px solid #f2c4bf}
  .feed .verdict{font-weight:800;font-size:16px;margin-bottom:7px}
  .feed.ok .verdict{color:var(--ok)}
  .feed.ng .verdict{color:var(--ng)}
  .feed .ansline{font-size:19px;font-weight:800;margin-bottom:8px}
  .goro{background:#fff;border:1px dashed #c3cfe0;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.6}
  .goro b{color:var(--accent)}
  .nav{display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  /* result */
  #result{display:none;text-align:center}
  .score{font-size:52px;font-weight:800;color:var(--accent);line-height:1.1}
  .scoresub{color:var(--muted);font-size:14px;margin-top:4px}
  .misslist{text-align:left;margin-top:18px}
  .misslist h3{font-size:13px;color:var(--muted);letter-spacing:.08em;margin:0 0 8px}
  .missrow{border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:8px;padding:9px 11px;margin-bottom:7px;font-size:13.5px;background:#fff}
  .missrow b{color:var(--accent)}
  .missrow .mg{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
  /* list mode */
  #listmode{display:none}
  table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
  th{background:#e9eff8;color:var(--accent);font-size:12.5px;position:sticky;top:0}
  td.yr{width:64px;text-align:center;font-weight:700;color:var(--accent)}
  tr.hide td.hidden-cell{color:transparent;background:#eef2f8;cursor:pointer;border-radius:4px}
  .hint{font-size:12px;color:var(--muted);margin:0 0 8px}
  .eratitle{margin:20px 0 7px;font-size:15px;font-weight:800;color:var(--accent);border-bottom:2px solid var(--accent2);padding-bottom:4px}
  footer{text-align:center;color:var(--muted);font-size:11.5px;padding:20px 10px 30px}
</style>
</head>
<body>
<header>
  <h1>入試頻出！重要年代120問　自己テスト</h1>
  <p>出題形式・時代・問題数を選んでスタート。まちがえた問題は最後にまとめて復習できます。</p>
</header>

<div class="wrap">

  <div id="setup">
    <div class="panel">
      <h2>1. 出題形式</h2>
      <div class="row" id="modeRow">
        <button class="chip on" data-mode="e2y">出来事 → 年号（記述）</button>
        <button class="chip" data-mode="e2yc">出来事 → 年号（4択）</button>
        <button class="chip" data-mode="y2e">年号 → 出来事（4択）</button>
        <button class="chip" data-mode="order">古い順に並べる</button>
      </div>
    </div>

    <div class="panel">
      <h2>2. 出題範囲（時代）</h2>
      <div class="row" id="eraRow"></div>
      <div class="row">
        <button class="ghost" id="allEra">すべて選択</button>
        <button class="ghost" id="noEra">すべて解除</button>
      </div>
    </div>

    <div class="panel">
      <h2>3. 問題数</h2>
      <div class="row" id="cntRow">
        <button class="chip on" data-cnt="10">10問</button>
        <button class="chip" data-cnt="20">20問</button>
        <button class="chip" data-cnt="30">30問</button>
        <button class="chip" data-cnt="0">全問</button>
      </div>
      <div class="stats"><span id="poolInfo"></span></div>
    </div>

    <div class="row" style="justify-content:center;margin-top:4px">
      <button class="primary" id="startBtn">テスト開始</button>
      <button class="ghost" id="listBtn">一覧・暗記モードを見る</button>
    </div>
  </div>

  <div id="quiz">
    <div class="qmeta"><span id="prog"></span><span id="live"></span></div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="qbox" style="margin-top:12px">
      <div class="qlabel" id="qlabel"></div>
      <p class="qtext" id="qtext"></p>
      <div class="qera" id="qera"></div>
      <div class="ansarea" id="ansarea"></div>
      <div class="feed" id="feed">
        <div class="verdict" id="verdict"></div>
        <div class="ansline" id="ansline"></div>
        <div class="goro" id="goroline"></div>
      </div>
      <div class="nav" id="nav"></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="ghost" id="quitBtn">やめて設定に戻る</button>
    </div>
  </div>

  <div id="result">
    <div class="panel">
      <div class="score" id="scoreNum"></div>
      <div class="scoresub" id="scoreSub"></div>
      <div class="bar"><i id="rbar"></i></div>
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="primary" id="retryMiss">まちがえた問題だけ再挑戦</button>
        <button class="ghost" id="againBtn">もう一度同じ設定で</button>
        <button class="ghost" id="backBtn">設定に戻る</button>
      </div>
    </div>
    <div class="panel misslist" id="missPanel">
      <h3>まちがえた問題</h3>
      <div id="missBody"></div>
    </div>
  </div>

  <div id="listmode">
    <div class="panel">
      <div class="row">
        <button class="chip on" id="showAll">全部表示</button>
        <button class="chip" id="hideYear">年号を隠す</button>
        <button class="chip" id="hideEvent">出来事を隠す</button>
        <button class="ghost" id="listBack">テストに戻る</button>
      </div>
      <p class="hint">隠したマスをクリック（タップ）すると、その1つだけ答えが出ます。</p>
    </div>
    <div id="listBody"></div>
  </div>

</div>
<footer>入試頻出！重要年代120問　自己テスト｜語呂合わせは各問の解説に表示されます</footer>

(function(){ var seen={}; for(var i=0;i<DATA.length;i++){ if(!seen[DATA[i].era]){seen[DATA[i].era]=1;ERAS.push(DATA[i].era);} } })();

var mode='e2y', count=10, selEras={}, queue=[], idx=0, correct=0, misses=[], answered=false, lastSettings=null;

function $(id){return document.getElementById(id);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---- setup UI ---- */
ERAS.forEach(function(e){
  selEras[e]=true;
  var b=document.createElement('button');
  b.className='chip on'; b.textContent=e; b.setAttribute('data-era',e);
  b.onclick=function(){ selEras[e]=!selEras[e]; b.className='chip'+(selEras[e]?' on':''); updatePool(); };
  $('eraRow').appendChild(b);
});
function bindChips(rowId, attr, cb){
  var row=$(rowId);
  row.addEventListener('click', function(ev){
    var t=ev.target; if(t.tagName!=='BUTTON'||!t.hasAttribute(attr))return;
    var bs=row.querySelectorAll('button[' + attr + ']');
    for(var i=0;i<bs.length;i++) bs[i].className='chip';
    t.className='chip on'; cb(t.getAttribute(attr));
  });
}
bindChips('modeRow','data-mode',function(v){mode=v;updatePool();});
bindChips('cntRow','data-cnt',function(v){count=parseInt(v,10);updatePool();});
$('allEra').onclick=function(){ERAS.forEach(function(e){selEras[e]=true;});syncEra();};
$('noEra').onclick=function(){ERAS.forEach(function(e){selEras[e]=false;});syncEra();};
function syncEra(){
  var bs=$('eraRow').querySelectorAll('button[data-era]');
  for(var i=0;i<bs.length;i++){var e=bs[i].getAttribute('data-era');bs[i].className='chip'+(selEras[e]?' on':'');}
  updatePool();
}
function pool(){ return DATA.filter(function(d){return selEras[d.era];}); }
function updatePool(){
  var n=pool().length;
  var extra = (mode==='order') ? '　※並べ替えは4問セットで出題します' : '';
  $('poolInfo').textContent='選択中の範囲：'+n+'問'+(count?('／出題：'+Math.min(count,n)+'問'):'／出題：全'+n+'問')+extra;
}
updatePool();

/* ---- start ---- */
$('startBtn').onclick=function(){ lastSettings={mode:mode,count:count,eras:JSON.parse(JSON.stringify(selEras))}; buildQueue(pool()); run(); };
$('againBtn').onclick=function(){ buildQueue(pool()); run(); };
$('backBtn').onclick=function(){ show('setup'); };
$('quitBtn').onclick=function(){ show('setup'); };
$('retryMiss').onclick=function(){
  var items=misses.map(function(m){return m.item;});
  if(!items.length){show('setup');return;}
  buildQueue(items, true); run();
};

function buildQueue(src, all){
  var arr=shuffle(src.slice());
  var n=(all||count===0)?arr.length:Math.min(count,arr.length);
  if(mode==='order'){
    var groups=[]; var pooled=shuffle(src.slice());
    var want=(all||count===0)?Math.max(1,Math.floor(pooled.length/4)):Math.max(1,Math.round(n/4));
    for(var g=0; g<want && pooled.length>=4; g++){ groups.push(pooled.splice(0,4)); }
    queue=groups;
  } else {
    queue=arr.slice(0,n);
  }
  idx=0; correct=0; misses=[];
}

function show(which){
  ['setup','quiz','result','listmode'].forEach(function(k){ $(k).style.display = (k===which) ? (k==='result'?'block':'block') : 'none'; });
  window.scrollTo(0,0);
}
function run(){ show('quiz'); render(); }

/* ---- render ---- */
function render(){
  answered=false;
  var total=queue.length;
  if(idx>=total){ finish(); return; }
  $('prog').textContent='第'+(idx+1)+'問 / 全'+total+'問';
  $('live').textContent='正解 '+correct+'　誤答 '+misses.length;
  $('barfill').style.width=(idx/total*100)+'%';
  $('feed').style.display='none'; $('feed').className='feed';
  $('nav').innerHTML=''; $('ansarea').innerHTML='';

  if(mode==='order'){ renderOrder(); return; }
  var it=queue[idx];
  $('qera').textContent=it.era;

  if(mode==='y2e'){
    $('qlabel').textContent='この年に起きた出来事は？';
    $('qtext').textContent=it.y+'年';
    var opts=makeOptions(it,'e');
    var box=document.createElement('div'); box.className='choices';
    opts.forEach(function(o){
      var b=document.createElement('button'); b.textContent=o.e;
      b.onclick=function(){ if(answered)return; judge(o.y===it.y, it, b, o.e); };
      box.appendChild(b);
    });
    $('ansarea').appendChild(box);
  } else if(mode==='e2yc'){
    $('qlabel').textContent='この出来事は何年？';
    $('qtext').textContent=it.e;
    var opts2=makeOptions(it,'y');
    var box2=document.createElement('div'); box2.className='choices';
    opts2.forEach(function(o){
      var b=document.createElement('button'); b.textContent=o.y+'年';
      b.onclick=function(){ if(answered)return; judge(o.y===it.y, it, b, o.y+'年'); };
      box2.appendChild(b);
    });
    $('ansarea').appendChild(box2);
  } else {
    $('qlabel').textContent='この出来事は何年？（数字を入力）';
    $('qtext').textContent=it.e;
    var inp=document.createElement('input'); inp.type='text'; inp.inputMode='numeric'; inp.placeholder='年'; inp.id='inp';
    var sub=document.createElement('button'); sub.className='primary'; sub.textContent='答え合わせ'; sub.style.marginLeft='10px';
    sub.onclick=function(){ if(answered)return; var v=(inp.value||'').replace(/[^0-9]/g,''); judge(parseInt(v,10)===it.y, it, null, v?v+'年':'（無回答）'); };
    inp.onkeydown=function(ev){ if(ev.key==='Enter'){ sub.click(); } };
    $('ansarea').appendChild(inp); $('ansarea').appendChild(sub);
    setTimeout(function(){inp.focus();},60);
  }
}

function makeOptions(it, key){
  var others=DATA.filter(function(d){return d.y!==it.y;});
  others.sort(function(a,b){return Math.abs(a.y-it.y)-Math.abs(b.y-it.y);});
  var near=shuffle(others.slice(0,14)).slice(0,3);
  return shuffle([it].concat(near));
}

function judge(ok, it, btn, given){
  answered=true;
  if(ok){ correct++; } else { misses.push({item:it, given:given}); }
  if(btn){
    btn.className = ok?'pickok':'pickng';
    if(!ok){
      var bs=btn.parentNode.querySelectorAll('button');
      for(var i=0;i<bs.length;i++){
        var txt=bs[i].textContent;
        if(txt===(it.y+'年')||txt===it.e){ bs[i].className='pickok'; }
      }
    }
  }
  var f=$('feed'); f.className='feed '+(ok?'ok':'ng'); f.style.display='block';
  $('verdict').textContent = ok ? '◯　正解！' : '×　まちがい';
  $('ansline').textContent = it.y+'年　'+it.e + (ok?'':'　（あなたの答え：'+given+'）');
  $('goroline').innerHTML = '<b>語呂合わせ：</b>'+esc(it.g);
  var nb=document.createElement('button'); nb.className='primary';
  nb.textContent = (idx===queue.length-1)?'結果を見る':'次の問題へ';
  nb.onclick=function(){ idx++; render(); };
  $('nav').appendChild(nb);
  setTimeout(function(){nb.focus();},50);
}

/* ---- order mode ---- */
var orderPick=[];
function renderOrder(){
  var grp=queue[idx];
  orderPick=[];
  $('qlabel').textContent='古い順にクリックしよう';
  $('qtext').textContent='次の4つを古い順に並べよう';
  $('qera').textContent='';
  var box=document.createElement('div'); box.className='choices';
  shuffle(grp.slice()).forEach(function(o){
    var b=document.createElement('button'); b.textContent=o.e;
    b.onclick=function(){
      if(answered||b.disabled)return;
      b.disabled=true; b.className='picked'; orderPick.push(o); b._item=o;
      b.textContent=orderPick.length+'. '+o.e;
      if(orderPick.length===4){
        var sorted=grp.slice().sort(function(a,c){return a.y-c.y;});
        var ok=true; for(var i=0;i<4;i++){ if(orderPick[i].y!==sorted[i].y) ok=false; }
        answered=true;
        var bs=box.querySelectorAll('button');
        for(var k=0;k<bs.length;k++){
          var pos=orderPick.indexOf(bs[k]._item);
          bs[k].className = (sorted[pos] && sorted[pos].y===bs[k]._item.y) ? 'pickok' : 'pickng';
        }
        if(ok){correct++;}else{misses.push({item:sorted[0], given:'並べ替えミス', order:sorted});}
        var f=$('feed'); f.className='feed '+(ok?'ok':'ng'); f.style.display='block';
        $('verdict').textContent=ok?'◯　正解！':'×　順番がちがいます';
        $('ansline').textContent=sorted.map(function(s){return s.y+' '+s.e;}).join('　→　');
        $('goroline').innerHTML=sorted.map(function(s){return '<b>'+s.y+'</b>：'+esc(s.g);}).join('<br>');
        var nb=document.createElement('button'); nb.className='primary';
        nb.textContent=(idx===queue.length-1)?'結果を見る':'次の問題へ';
        nb.onclick=function(){ idx++; render(); };
        $('nav').appendChild(nb);
      }
    };
    box.appendChild(b);
  });
  $('ansarea').appendChild(box);
}

/* ---- result ---- */
function finish(){
  show('result');
  var total=queue.length;
  var pct=total?Math.round(correct/total*100):0;
  $('scoreNum').textContent=correct+' / '+total;
  $('scoreSub').textContent='正答率 '+pct+'％　'+(pct>=90?'すばらしい！この調子。':pct>=70?'あと一歩。まちがえた問題を語呂で固めよう。':'ストーリーを読み直してから再挑戦しよう。');
  $('rbar').style.width=pct+'%';
  var mb=$('missBody'); mb.innerHTML='';
  if(!misses.length){ $('missPanel').style.display='none'; return; }
  $('missPanel').style.display='block';
  misses.forEach(function(m){
    var d=document.createElement('div'); d.className='missrow';
    if(m.order){
      d.innerHTML='<b>並べ替え</b>　正しい順：'+m.order.map(function(s){return s.y+' '+esc(s.e);}).join(' → ');
    } else {
      d.innerHTML='<b>'+m.item.y+'年</b>　'+esc(m.item.e)+'<span class="mg">語呂：'+esc(m.item.g)+'</span>';
    }
    mb.appendChild(d);
  });
}

/* ---- list mode ---- */
$('listBtn').onclick=function(){ buildList(); show('listmode'); };
$('listBack').onclick=function(){ show('setup'); };
var hideMode='none';
function setHide(m,btn){
  hideMode=m;
  ['showAll','hideYear','hideEvent'].forEach(function(k){$(k).className='chip';});
  btn.className='chip on'; buildList();
}
$('showAll').onclick=function(){setHide('none',this);};
$('hideYear').onclick=function(){setHide('y',this);};
$('hideEvent').onclick=function(){setHide('e',this);};

function buildList(){
  var body=$('listBody'); body.innerHTML='';
  ERAS.forEach(function(era){
    var items=DATA.filter(function(d){return d.era===era;});
    if(!items.length)return;
    var h=document.createElement('div'); h.className='eratitle'; h.textContent=era; body.appendChild(h);
    var t=document.createElement('table');
    t.innerHTML='<tr><th style="width:66px">年</th><th style="width:34%">出来事</th><th>語呂合わせ</th></tr>';
    items.forEach(function(d){
      var tr=document.createElement('tr');
      var yc='yr'+(hideMode==='y'?' hidden-cell':'');
      var ec=(hideMode==='e'?'hidden-cell':'');
      tr.innerHTML='<td class="'+yc+'">'+d.y+'</td><td class="'+ec+'">'+esc(d.e)+'</td><td>'+esc(d.g)+'</td>';
      if(hideMode!=='none'){
        tr.className='hide';
        var cell=tr.querySelector('.hidden-cell');
        if(cell) cell.onclick=function(){ cell.className=cell.className.replace('hidden-cell','').trim(); };
      }
      t.appendChild(tr);
    });
    body.appendChild(t);
  });
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
